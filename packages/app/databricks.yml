bundle:
  name: catnat-app

sync:
  include:
    - .build

artifacts:
  default:
    build: apx build

resources:
  apps:
    catnat-app-app:
      name: "catnat-app"
      description: "catnat-app created with apx"
      source_code_path: ./.build

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-serverless-stable-po64og.cloud.databricks.com
      profile: fevm-stable-po64og
